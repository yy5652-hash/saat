name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test
        working-directory: contracts
        run: forge test -vv

  python:
    name: Python (pytest, end to end on Anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge build (artifacts the Python client deploys)
        working-directory: contracts
        run: forge build
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
