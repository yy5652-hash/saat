name: pages

# The dashboard as a static page: the run recorded by scripts/record_replay.py, replayed in the browser,
# plus a card that reads the live SaatRegistry on Ethereum Sepolia.
on:
  push:
    branches: [main]
    paths: ["app/static/**", "results/replay_day.json", "results/public_chain_day.json", "scripts/build_pages.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build_pages.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
